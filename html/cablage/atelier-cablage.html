<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atelier de câblage</title>
<meta name="description" content="Câbler de l’appareillage réel, domestique et industriel, sur une platine : bornes repérées, couleurs et sections des conducteurs, mise sous tension, VAT, multimètre, pince ampèremétrique et wattmètre-prise. 35 appareils, 22 missions vérifiées, du CAP au bac pro MELEC, sans matériel.">
<meta name="etiquette" content="Outil · Électrotechnique">
<meta name="porte-compte" content="35 appareils, 22 missions">
<meta name="stockage" content="atelier-cablage-v1 : la platine en cours, les missions réussies et les réglages d’affichage">
<!-- Atelier de câblage : écrit le 11 novembre 2026, sur le modèle de l'atelier schéma électrique.
     Sources dans _commun/tp/simulations/cablage/src/, assemblées par cablage/assembler.py.
     Fichier autonome, aucune requête. Ne pas retoucher ce fichier : il est assemblé. -->
<style>
/* Atelier de câblage, coquille reprise de l’atelier schéma : bibliothèque à gauche · platine au centre · colonne de droite (panneau du composant, fenêtres rangées) ;
   les fenêtres détachées flottent au-dessus. « Bibliothèque » et « Panneau » cachent leur colonne. */
:root{
  --ui:'Red Hat Text', 'Helvetica Neue', 'Segoe UI', Arial, sans-serif;
  --mono:'Share Tech Mono', ui-monospace, Consolas, monospace;
  --bg:#ECEAE4; --surface:#FFFFFF; --line:#D2D6CF; --fg:#16201B; --muted:#5B6660;
  --accent:#1F6B4A; --accent-soft:#DBE9E1; --on-accent:#FFFFFF;
  --warn:#9A4A12; --warn-soft:#F6E7D8; --danger:#A8432C;
  --paper:#FBFCFA; /* la feuille reste claire dans les deux thèmes, comme un tableau blanc */
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111614; --surface:#182020; --line:#35403C; --fg:#E9EFE9; --muted:#9AA8A1;
  --accent:#53B98A; --accent-soft:#1D3A2D; --on-accent:#0B1D14;
  --warn:#E3A062; --warn-soft:#3A2A18; --danger:#E07F66; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#182020; --line:#35403C; --fg:#E9EFE9; --muted:#9AA8A1;
  --accent:#53B98A; --accent-soft:#1D3A2D; --on-accent:#0B1D14;
  --warn:#E3A062; --warn-soft:#3A2A18; --danger:#E07F66; color-scheme:dark }
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:15px}
.app{display:flex;flex-direction:column;gap:12px;padding-block:14px 24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1500px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 18px}
.brand h1{margin:0;font-size:1.35rem;letter-spacing:-.01em;text-wrap:balance}
.retour{display:inline-block;font-size:.84rem;font-weight:700;color:var(--accent);text-decoration:none;margin-bottom:4px}
.retour:hover{text-decoration:underline}
.brand p{margin:2px 0 0;color:var(--muted);font-size:.88rem}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{box-sizing:border-box;display:inline-flex;align-items:center;gap:6px;font:700 .88rem var(--ui);color:var(--fg);background:var(--surface);
  border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;min-height:38px}
.btn:hover{border-color:var(--accent)}
.btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.confirm{background:var(--danger);color:#fff;border-color:var(--danger)}
select.btn{padding-right:28px;max-width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.work{display:grid;grid-template-columns:200px minmax(0,1fr) 300px;gap:12px;align-items:start}
.lib,.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.lib{padding:8px;display:flex;flex-direction:column;gap:8px}
/* la bibliothèque défile seule, à hauteur d'écran (hauteur posée par ajusteLib) ; au doigt, glisser vers
   le haut ou le bas la fait défiler, glisser vers la platine pose l'appareil */
.lib{position:sticky;top:10px;box-sizing:border-box;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
.libsec{display:flex;flex-direction:column;gap:4px}
.libgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.lab{font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:2px 4px 0}
.item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 3px;border-radius:8px;border:1px solid transparent;background:none;
  color:inherit;font:inherit;cursor:grab;text-align:center;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.item:hover{background:var(--accent-soft)}
.item.on{border-color:var(--accent);background:var(--accent-soft)}
.item svg{width:64px;height:38px;flex:none;background:var(--paper);border:1px solid var(--line);border-radius:6px}
.item b{display:block;font-size:.76rem;line-height:1.15}
.libnote{font-size:.74rem;color:var(--muted);margin:0 4px;line-height:1.35}

.stage{min-width:0;display:flex;flex-direction:column;gap:8px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{font:700 .86rem var(--ui);color:var(--fg);background:none;border:0;padding:8px 13px;cursor:pointer;min-height:38px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.seg.full{display:flex}.seg.full button{flex:1;padding:8px 6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:6px 11px;cursor:pointer;user-select:none}
.chip input{accent-color:var(--accent);margin:0}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.06)}
#pl{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none}
.status{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.86rem;color:var(--muted);min-height:1.4em}
.pill{font-weight:700;font-size:.8rem;border-radius:999px;padding:3px 10px}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.info{background:var(--accent-soft);color:var(--accent)}

.panel{padding:14px;display:flex;flex-direction:column;gap:14px}
#propsBox,#readBox{display:flex;flex-direction:column;gap:14px}
.panel h2{margin:0;font-size:1.1rem}
.panel .sub{color:var(--muted);font-size:.84rem;margin-top:2px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.flab{font-size:.82rem;color:var(--muted);font-weight:700}
.field .in{display:flex;align-items:center;gap:6px}
.field input[type=number],.field input[type=text]{width:100%;font:1rem var(--mono);padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--fg)}
.field input[type=text]{font-family:var(--ui)}
.field input[type=range]{width:100%;accent-color:var(--accent)}
.field .u{font-family:var(--mono);color:var(--muted);min-width:1.8em}
.note{font-size:.78rem;color:var(--muted);line-height:1.35}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.presets button{font:700 .8rem var(--ui);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:5px 10px;cursor:pointer}
.presets button:hover{border-color:var(--accent)}
.presets button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.big{font:2rem var(--mono);letter-spacing:.02em;background:#C9D4B5;color:#1B2416;border:1px solid #5B6650;border-radius:8px;padding:6px 12px;text-align:right}
.big small{font-size:.9rem;margin-left:6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.9rem;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.hint{font-size:.85rem;line-height:1.4;border-radius:8px;padding:9px 11px;background:var(--warn-soft);color:var(--warn)}
.err{font-size:.8rem;color:var(--danger)}
.help{font-size:.86rem;line-height:1.45;color:var(--muted);margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.help b{color:var(--fg)}
.toggle-big{width:100%;justify-content:center;font-size:1rem;min-height:46px}

.ghostdrag{position:fixed;left:0;top:0;pointer-events:none;z-index:50;opacity:.85}
.ghostdrag svg{width:88px;height:52px;background:var(--paper);border:1px solid var(--accent);border-radius:8px}
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,15,18,.55);display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal .card{background:var(--surface);border-radius:12px;padding:16px;max-width:900px;width:100%;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px}
.modal img{max-width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;align-self:center}
.modal p{margin:0;color:var(--muted);font-size:.88rem}


/* la colonne de droite : le panneau, puis les fenêtres qu'on y range */
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.dock{display:flex;flex-direction:column;gap:12px;min-width:0}
.dock:empty{display:none}
.app.no-lib .lib{display:none}
.app.no-side .side{display:none}
.app.no-lib .work{grid-template-columns:minmax(0,1fr) 300px}
.app.no-side .work{grid-template-columns:200px minmax(0,1fr)}
.app.no-lib.no-side .work{grid-template-columns:minmax(0,1fr)}

/* les fenêtres */
.win{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-width:0}
.win.float{position:fixed;z-index:40;max-height:calc(100% - 24px);overflow:auto;box-shadow:0 12px 32px rgba(0,0,0,.28)}
.win.docked{position:relative}
.win-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px 6px 12px;border-bottom:1px solid var(--line);user-select:none;-webkit-user-select:none}
.win.float .win-head{cursor:move;touch-action:none;position:sticky;top:0;background:var(--surface);z-index:1;border-radius:12px 12px 0 0}
.win-title{font-size:.95rem}
.win-btns{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.wbtn{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--fg);cursor:pointer;padding:0}
.wbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wbtn:hover{border-color:var(--accent)}
.win.docked [data-w="dock"]{background:var(--accent-soft);border-color:var(--accent)}
.btn.sm{min-height:34px;padding:5px 10px;font-size:.8rem}
.win-body{display:flex;flex-direction:column;min-width:0}
.win-body>.row{padding:8px 10px}
.win.min .win-body,.win.min .win-grip{display:none}
.win.min .win-head{border-bottom:0}
.win-grip{position:absolute;right:2px;bottom:2px;width:22px;height:22px;cursor:nwse-resize;touch-action:none;
  background:linear-gradient(135deg,transparent 52%,var(--muted) 52%,var(--muted) 58%,transparent 58%,transparent 70%,var(--muted) 70%,var(--muted) 76%,transparent 76%);opacity:.6}
.win.docked .win-grip{display:none}

/* les menus « Affichage » et « Fenêtres », et les interrupteurs de disposition */
.pop{position:relative}
.pop>summary{list-style:none;display:flex}
.pop>summary::-webkit-details-marker{display:none}
.pop[open]>summary{border-color:var(--accent);background:var(--accent-soft)}
.pop-body{position:absolute;left:0;top:calc(100% + 6px);z-index:45;width:max-content;min-width:250px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);
  border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.2);padding:12px;display:flex;flex-direction:column;gap:12px}
.pop-sec{display:flex;flex-direction:column;gap:4px}
.pop .ck{display:flex;align-items:center;gap:8px;font-size:.88rem;cursor:pointer;min-height:30px}
.pop .ck input{accent-color:var(--accent);width:17px;height:17px;margin:0}
.qrow{display:flex;flex-wrap:wrap;gap:0 16px}
#popWin .pop-body .btn{justify-content:flex-start}
#popWin .note{margin:0;max-width:260px}
.bar-sp{flex:1}
.btn.tog[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.btn.tog[aria-pressed="false"]{color:var(--muted)}
.btn[disabled]{opacity:.5;cursor:default}

@media (max-width:1150px){
  .work,.app.no-lib.no-side .work{grid-template-columns:200px minmax(0,1fr)}
  .app.no-lib .work{grid-template-columns:minmax(0,1fr)}
  .side{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:start}
  .dock{display:contents}
}
@media (max-width:760px){
  .work,.app.no-lib .work,.app.no-side .work,.app.no-lib.no-side .work{grid-template-columns:minmax(0,1fr)}
  .lib{flex-direction:row;overflow-x:auto;overflow-y:hidden;gap:6px;position:static;max-height:none!important}
  .libsec,.libgrid{display:contents}
  .lib .lab,.libnote{display:none}
  .item{flex:none;touch-action:pan-x;padding:5px}
  .win.float{left:8px!important;right:8px!important;top:auto!important;bottom:8px!important;width:auto!important;max-height:70vh}
  .win-grip{display:none}
  .bar-sp{display:none}
}

/* la consigne d'un exemple, sous la feuille */
.exnote{display:flex;gap:8px;align-items:flex-start;font-size:.9rem;line-height:1.4;background:var(--accent-soft);color:var(--fg);border-radius:8px;padding:8px 6px 8px 12px}
.exnote span{flex:1}

/* ===== l'atelier de câblage : la platine, les appareils, les bornes, les conducteurs ===== */
.misbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 8px 6px 12px}
.misbar b{font-size:.95rem;margin-right:4px}
.seg.sm button{min-height:34px;padding:5px 10px;font-size:.82rem}
select.btn.sm{min-height:34px;padding:5px 26px 5px 9px}
.sheet{position:relative}
#pl{aspect-ratio:3/2;max-height:calc(100vh - 230px);min-height:340px;background:#E6E8E4}
#pl[data-outil="fil"],#pl[data-outil="vat"],#pl[data-outil="ohm"]{cursor:crosshair}
#pl[data-outil="gomme"]{cursor:cell}
#pl.placing{cursor:copy}
.dv{font:600 12px var(--ui);fill:#1E2428;stroke:none}
.dv.s{font-size:10.5px;font-weight:600;fill:#4A535A}.dv.b{font-weight:800}.dv.inv{fill:#fff}.dv.nm{font-size:13.5px;font-weight:800;fill:#1E2428}
.dev-halo{fill:none;stroke:transparent;stroke-width:2.5;stroke-dasharray:6 4}
.dev.sel .dev-halo{stroke:var(--accent)}
.act{cursor:pointer}.act:hover{fill:rgba(31,107,74,.10)}
.cadenas{fill:#8D959C;stroke:#5E676E;stroke-width:1}
.vis{fill:#D5D9DC;stroke:#4E565C;stroke-width:1.6}.vis.prise{fill:#B7BEC3}
.fente{stroke:#4E565C;stroke-width:1.6}
.borne-hit{fill:transparent;cursor:pointer}
.borne:hover .vis{stroke:var(--accent);stroke-width:3}
.borne.att .vis{fill:#F2C94C;stroke:#8D6E12;stroke-width:3}
.borne.trop .vis{stroke:#C62828;stroke-width:3}
.bl{font:700 10.5px var(--ui);fill:#20262B;paint-order:stroke;stroke:#F3F3EF;stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.fil{cursor:pointer}.fil-halo{fill:none;stroke:transparent;stroke-linecap:round}
.fil:hover .fil-halo{stroke:rgba(31,107,74,.18)}.fil.sel .fil-halo{stroke:rgba(242,201,76,.75)}
.elast{stroke:#202020;stroke-width:2.5;stroke-dasharray:6 5;pointer-events:none}.elast.mes{stroke:#C62828}
.toast{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);max-width:min(92%,640px);background:#1E2428;color:#fff;font-size:.9rem;line-height:1.35;
  border-radius:10px;padding:9px 14px;box-shadow:0 8px 24px rgba(0,0,0,.25);pointer-events:none}
.toast.trip{background:#8E2A1C}.toast.warn{background:#7A4A12}
.pill.live{background:#DDF1E3;color:#1F6B3A}.pill.off{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.pill.danger{background:#FBE0DC;color:#A32617}
.btn.power{min-width:190px;justify-content:center;background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.power.live{background:#B4361F;border-color:#B4361F;color:#fff}
.colnow{display:inline-block;width:22px;height:14px;border-radius:4px;border:1px solid rgba(0,0,0,.25)}
.swatches{display:grid;grid-template-columns:repeat(5,34px);gap:6px}
.sw{width:34px;height:34px;border-radius:8px;border:2px solid rgba(0,0,0,.18);cursor:pointer;padding:0}
.sw.on{outline:3px solid var(--accent);outline-offset:2px}
#popCol .note{margin:0;max-width:220px}
.panel .etat{margin:0;font-size:.88rem;background:var(--bg);border-radius:8px;padding:7px 10px}
.panel select{width:100%;font:.95rem var(--ui);padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--fg)}
.pan-mis{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.pan-bornes summary,.journal summary{cursor:pointer;font-size:.84rem;color:var(--muted);font-weight:700}
.journal ul{margin:6px 0 0;padding-left:18px;font-size:.84rem;line-height:1.4;display:flex;flex-direction:column;gap:4px}
.journal li.trip{color:var(--danger)}
.vat{display:flex;gap:4px;flex-wrap:wrap}
.vat .led{font:700 .74rem var(--mono);padding:4px 6px;border-radius:6px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.vat .led.on{background:#F2C94C;color:#3A2E05;border-color:#C9A227}.vat .led.dg{background:#E5533D;color:#fff;border-color:#A32617}
.pad{padding:10px 12px;margin:0}
.consigne{padding:4px 14px 12px;font-size:.92rem;line-height:1.45}
.consigne h3{margin:8px 0 4px;font-size:1.02rem}
.consigne p{margin:6px 0}.consigne .ce summary{cursor:pointer;font-weight:700;color:var(--accent);font-size:.88rem}
.consigne ul{margin:6px 0;padding-left:18px}
.sch-wrap{background:#fff;padding:6px;overflow:auto}
.schema{display:block;width:100%;height:auto;min-width:420px}
.schema .st{font:600 13px var(--ui);fill:#1a1a1a}.schema .st.b{font-weight:800}.schema .sn{font:600 11px var(--ui);fill:#333}.schema .stt{font:800 15px var(--ui);fill:#1a1a1a}
.verdict{margin:10px 12px 4px;padding:9px 12px;border-radius:9px;font-weight:800}
.verdict.ok{background:#DDF1E3;color:#1F6B3A}.verdict.ko{background:#FBE0DC;color:#A32617}
ul.verif{list-style:none;margin:0;padding:4px 12px 12px;display:flex;flex-direction:column;gap:6px;font-size:.9rem;line-height:1.4}
ul.verif li{display:flex;gap:8px;align-items:flex-start}
ul.verif li.vt{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-top:6px}
ul.verif .mk{flex:none;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:.8rem}
ul.verif li.ok .mk{background:#DDF1E3;color:#1F6B3A}ul.verif li.ko .mk{background:#FBE0DC;color:#A32617}
ul.verif em{display:block;font-style:normal;color:var(--muted);font-size:.84rem;margin-top:2px}
.item svg{width:72px;height:46px}
.ghostdrag svg{width:96px;height:62px}
@media (max-width:760px){.btn.power{min-width:0}#pl{aspect-ratio:4/5;max-height:none}}
/* les appareils de mesure du panneau (multimètre, pince, wattmètre-prise) */
.instr{display:block;width:100%;max-width:230px;height:auto;margin:6px auto 2px}
.instr .instr-pos{cursor:pointer}
.pince-liste{margin:2px 0 6px;padding-left:18px;font-size:.82rem;line-height:1.35;color:var(--muted)}
.ck-ligne{display:flex;align-items:center;gap:6px;font-size:.88rem;margin:6px 0;cursor:pointer}
.ck-ligne input{accent-color:var(--accent);width:17px;height:17px;margin:0}
.pan-watt{border-top:1px solid var(--line);margin-top:8px;padding-top:8px}
.pince-pl{pointer-events:none}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand">
      <a class="retour" href="../index.html">← Les simulations du labo</a>
      <h1>Atelier de câblage</h1>
      <p>Posez l’appareillage, tirez les conducteurs, mettez sous tension, mesurez. Domestique et industriel, du CAP au bac pro.</p>
    </div>
    <div class="actions">
      <select class="btn" id="missions" aria-label="Choisir une mission"></select>
      <button class="btn" id="recommencer"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>Recommencer</button>
      <button class="btn" id="undo" title="Annuler (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>Annuler</button>
    </div>
  </header>

  <div class="work">
    <aside class="lib" id="lib" aria-label="Bibliothèque d’appareillage"></aside>

    <section class="stage">
      <div class="bar">
        <div class="seg" role="group" aria-label="Outil">
          <button data-outil="sel" aria-pressed="true">Sélection</button>
          <button data-outil="fil" aria-pressed="false">Conducteur</button>
          <button data-outil="gomme" aria-pressed="false">Gomme</button>
          <button data-outil="vat" aria-pressed="false">VAT</button>
          <button data-outil="ohm" aria-pressed="false">Ohmmètre</button>
          <button data-outil="multi" aria-pressed="false">Multimètre</button>
          <button data-outil="pince" aria-pressed="false">Pince</button>
        </div>
        <details class="pop" id="popCol">
          <summary class="btn" title="Couleur du conducteur"><span class="colnow" id="colNow"></span><span id="colLab"></span></summary>
          <div class="pop-body"><span class="flab">Couleur du conducteur</span><div class="swatches" id="swCol"></div>
            <p class="note">Bleu clair : le neutre. Vert-jaune : la terre. Les autres pour les phases, les retours et la commande.</p></div>
        </details>
        <select class="btn" id="sec" aria-label="Section du conducteur"></select>
        <button class="btn power" id="power"></button>
      </div>
      <div class="misbar"><b id="misTitre"></b>
        <button class="btn sm" data-open="consigne">Consigne</button><button class="btn sm" data-open="schema">Schéma</button>
        <button class="btn sm tog" id="b-range" aria-pressed="false" title="Reprendre les conducteurs en tracé orthogonal, comme en goulotte"><svg viewBox="0 0 24 24"><path d="M4 6h7v12h9"/><path d="M4 12h4v8"/></svg>Ranger les conducteurs</button>
        <button class="btn sm primary" id="btnVerif"><svg viewBox="0 0 24 24"><path d="M5 12l4 4 10-10"/></svg>Vérifier mon câblage</button>
        <span class="bar-sp"></span>
        <div class="seg sm" role="group" aria-label="Zoom"><button id="zMoins" title="Éloigner">−</button><button id="zFit" title="Tout voir">Ajuster</button><button id="zPlus" title="Approcher">+</button></div>
        <select class="btn sm" id="acc" aria-label="Vitesse du temps"><option value="1">Temps réel</option><option value="10">Temps × 10</option></select>
        <button class="btn sm tog" id="b-lib" aria-pressed="true" title="Montrer ou cacher la bibliothèque"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>Bibliothèque</button>
        <button class="btn sm tog" id="b-panel" aria-pressed="true" title="Montrer ou cacher le panneau"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>Panneau</button></div>
      <div class="sheet">
        <svg id="pl" viewBox="0 0 1500 980" xmlns="http://www.w3.org/2000/svg" aria-label="Platine de câblage">
          <defs><pattern id="grille" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#E6E8E4"/><circle cx="10" cy="10" r="2.2" fill="#C7CBC5"/></pattern></defs>
          <rect x="-3000" y="-3000" width="9000" height="9000" fill="url(#grille)"/>
          <g id="lyDev"></g><g id="lyFil"></g><g id="lyBor"></g><g id="lyUi"></g>
        </svg>
        <div class="toast" id="toast" hidden></div>
      </div>
      <div class="status" id="status"></div>
    </section>

    <div class="side" id="side">
      <aside class="panel" id="panel"><div id="propsBox"></div></aside>
      <div class="dock" id="dock" aria-label="Fenêtres rangées"></div>
    </div>
  </div>
</div>

<script>
(()=>{
/* ================= base =================
   L'atelier de câblage : une platine où l'on pose l'appareillage réel, domestique et
   industriel, avec ses bornes repérées. On tire des conducteurs de la couleur et de la
   section choisies, on met sous tension, on manœuvre, on mesure au VAT et à l'ohmmètre.
   Le moteur calcule les tensions en 50 Hz (méthode des nœuds, nombres complexes), les
   protections déclenchent, les contacteurs s'enclenchent, le moteur tourne.
   Tous les modules sont dans la même fonction : ils partagent leurs variables. */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const SVGNS='http://www.w3.org/2000/svg';
function E(tag,at,par){const e=document.createElementNS(SVGNS,tag);if(at)for(const k in at)e.setAttribute(k,at[k]);if(par)par.appendChild(e);return e;}
function T(par,x,y,s,at){const t=E('text',Object.assign({x,y},at||{}),par);t.textContent=s;return t;}
function H(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* nombres à la française : virgule, espace insécable entre milliers */
function nf(v,d){if(!isFinite(v))return '—';const s=(+v).toFixed(d==null?0:d).split('.');
  s[0]=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,' ');return s.join(',');}
/* une tension ou une intensité lisible : 230 V, 0,23 A, 25 mA */
function fv(u){u=Math.abs(u);return u<0.5?'0 V':nf(u,u<10?1:0)+' V';}
function fa(i){i=Math.abs(i);return i<1e-4?'0 A':i<1?nf(i*1000,0)+' mA':nf(i,i<10?2:1)+' A';}
/* les nombres complexes, en couples [réel, imaginaire] */
const cadd=(a,b)=>[a[0]+b[0],a[1]+b[1]], csub=(a,b)=>[a[0]-b[0],a[1]-b[1]];
const cmul=(a,b)=>[a[0]*b[0]-a[1]*b[1],a[0]*b[1]+a[1]*b[0]];
const cdiv=(a,b)=>{const m=b[0]*b[0]+b[1]*b[1]||1e-30;return[(a[0]*b[0]+a[1]*b[1])/m,(a[1]*b[0]-a[0]*b[1])/m];};
const cabs=a=>Math.hypot(a[0],a[1]);
const cpol=(m,deg)=>[m*Math.cos(deg*Math.PI/180),m*Math.sin(deg*Math.PI/180)];
const C0=[0,0];
/* le réseau : 230 V entre phase et neutre, phases décalées de 120° (ordre direct L1, L2, L3) */
const VPH=230;
const POT={L1:cpol(VPH,0),L2:cpol(VPH,-120),L3:cpol(VPH,120),N:C0,PE:C0};

/* les couleurs des conducteurs ; vert-jaune se dessine en deux traits */
const COUL={
  marron:{n:'marron',c:'#7A4A26'},noir:{n:'noir',c:'#202020'},gris:{n:'gris',c:'#8C9196'},
  rouge:{n:'rouge',c:'#C62828'},bleu:{n:'bleu clair',c:'#3B8ED8'},vj:{n:'vert-jaune',c:'#2E9B47',c2:'#F2D021'},
  orange:{n:'orange',c:'#EF7D16'},violet:{n:'violet',c:'#7B4FB0'},blanc:{n:'blanc',c:'#F2F2EE'}};
const ORDRE_COUL=['marron','noir','gris','rouge','bleu','vj','orange','violet','blanc'];
const SECTIONS=[1,1.5,2.5,4,6];
const fsec=s=>nf(s,s%1?1:0)+' mm²';
/* ================= l'appareillage =================
   Chaque appareil : ses bornes repérées (position, sens de sortie du conducteur, rôle N ou PE),
   ses liaisons internes fermées (links), ses récepteurs (loads : impédance complexe entre deux
   bornes), ses sources (sources), sa protection (prot), son dessin (draw), ses organes de
   manœuvre (act), sa logique (upd, à chaque calcul) et son horloge (tick).
   Les valeurs sont des ordres de grandeur d'atelier, à relire avec le collègue d'électrotechnique. */
const DV={mod:'#F3F3EF',modb:'#8D959C',ind:'#D9DCDF',indb:'#6B737A',plaque:'#FBFBF8',txt:'#1E2428',mut:'#5E676E'};
function corps(g,w,h,f,s,rx){return E('rect',{x:0,y:0,width:w,height:h,rx:rx==null?6:rx,fill:f||DV.mod,stroke:s||DV.modb,'stroke-width':1.6},g);}
/* la couleur d'un texte passe par style : la classe .dv l'emporterait sur l'attribut fill */
function lab(g,x,y,s,o){o=Object.assign({'text-anchor':'middle',class:'dv'},o||{});if(o.fill){o.style=(o.style?o.style+';':'')+'fill:'+o.fill;delete o.fill;}return T(g,x,y,s,o);}
function zone(g,id,x,y,w,h){return E('rect',{x,y,width:w,height:h,rx:6,fill:'transparent','data-act':id,class:'act'},g);}
function nomDev(g,d,x,y){return lab(g,x,y,d.nm,{class:'dv nm'});}
function levierMod(g,x,y,on,trip){
  E('rect',{x:x-11,y:y-24,width:22,height:48,rx:4,fill:'#30363C'},g);
  E('rect',{x:x-9,y:on?y-22:y+4,width:18,height:18,rx:3,fill:on?'#2E9B47':trip?'#C62828':'#A9B0B6'},g);
  zone(g,'lever',x-18,y-28,36,56);
}
/* ---------- l'appareillage modulaire à la façon Schneider Electric (demandé le 11 novembre 2026) ----------
   Relevé sur les photos des fiches Balitrand : Resi9 XP (disjoncteur DM 1P+N et interrupteur
   différentiel ID, neutre à gauche, manette blanche à fenêtre « I.ON » rouge ou « O.OFF » verte,
   bouton test « T ») et Acti9 iC60N (manettes blanches à bande rouge ou verte, barre de liaison
   noire). Le nom de la marque est écrit en texte, sans le logo. */
const SE={vert:'#3DCD58',corps:'#FBFBF9',epaule:'#E9EBE8',bord:'#A3AAAF',creux:'#DADDDE',on:'#D7261E',off:'#1E9A45'};
function tx(g,x,y,s,taille,coul,graisse,ancre){return T(g,x,y,s,{'text-anchor':ancre||'middle',class:'dv',
  style:'font-size:'+taille+'px;font-weight:'+(graisse||700)+';fill:'+(coul||'#2B3136')});}
/* le boîtier : épaules des bornes en haut et en bas, nez au milieu */
function boitierSE(g,w,h){E('rect',{x:0,y:0,width:w,height:h,rx:5,fill:SE.epaule,stroke:SE.bord,'stroke-width':1.6},g);
  E('rect',{x:3,y:26,width:w-6,height:h-50,rx:4,fill:SE.corps,stroke:SE.bord,'stroke-width':1.2},g);
  E('line',{x1:4,y1:24,x2:w-4,y2:24,stroke:'#C9CED1','stroke-width':1},g);E('line',{x1:4,y1:h-22,x2:w-4,y2:h-22,stroke:'#C9CED1','stroke-width':1},g);}
function nomSE(g,d,x,y){return tx(g,x,y,d.nm,13.5,d.s.trip?'#C62828':'#1E2428',800);}
function marqueSE(g,x,y,ancre){tx(g,x,y,'Schneider',8.6,SE.vert,800,ancre||'middle');}
/* la manette Resi9 : blanche, la fenêtre dit I.ON ou O.OFF */
function manetteResi9(g,x,y0,on){E('rect',{x:x-14,y:y0,width:28,height:32,rx:4,fill:SE.creux,stroke:'#B3B9BD','stroke-width':1},g);
  const y=on?y0+2:y0+14;E('rect',{x:x-12,y,width:24,height:16,rx:3,fill:'#FFFFFF',stroke:'#9EA5AA','stroke-width':1.1},g);
  tx(g,x,y+11,on?'I.ON':'O.OFF',6.6,on?SE.on:SE.off,800);zone(g,'lever',x-20,y0-3,40,38);}
/* une impédance : module et facteur de puissance */
const zpf=(m,pf)=>[m*pf,m*Math.sqrt(Math.max(0,1-pf*pf))];
const zR=r=>[r,0];
/* la bobine d'un contacteur : 24 V ou 230 V, 7 VA en maintien */
const zBob=vn=>zpf(vn*vn/7,0.3);
const rBob=vn=>vn>100?1400:15;
const BOB=[24,230];

const TYPES={
  /* ---------- alimentation et protection ---------- */
  res1:{nom:'Arrivée 230 V monophasée',cat:'alim',pre:'Réseau',w:170,h:90,
    bornes:[{n:'L',x:35,y:90,d:'b'},{n:'N',x:85,y:90,d:'b',f:'N'},{n:'PE',x:135,y:90,d:'b',f:'PE'}],
    init:d=>{d.s={on:false,trip:null};},
    sources:d=>d.s.on?{L:'L1',N:'N',PE:'PE'}:{PE:'PE'},
    prot:()=>({mt:60,diff:0.5,src:true}),ferme:d=>d.s.on,
    draw(g,d){corps(g,170,90,'#3A4148','#20262B',8);
      lab(g,85,22,'ARRIVÉE 230 V ~',{class:'dv inv b'});lab(g,85,38,'réseau TT · branchement 500 mA',{class:'dv inv s'});
      E('circle',{cx:150,cy:22,r:7,fill:d.s.on?'#4CC36E':d.s.trip?'#E5533D':'#6B737A'},g);
      },
    info:d=>d.s.on?'sous tension':d.s.trip?'déclenché : '+d.s.trip:'hors tension (consigné)'},
  res3:{nom:'Arrivée 3 × 400 V + N',cat:'alim',pre:'Réseau',w:240,h:90,
    bornes:[{n:'L1',x:30,y:90,d:'b'},{n:'L2',x:72,y:90,d:'b'},{n:'L3',x:114,y:90,d:'b'},{n:'N',x:156,y:90,d:'b',f:'N'},{n:'PE',x:205,y:90,d:'b',f:'PE'}],
    init:d=>{d.s={on:false,trip:null};},
    sources:d=>d.s.on?{L1:'L1',L2:'L2',L3:'L3',N:'N',PE:'PE'}:{PE:'PE'},
    prot:()=>({mt:63,diff:0.5,src:true}),ferme:d=>d.s.on,
    draw(g,d){corps(g,240,90,'#3A4148','#20262B',8);
      lab(g,120,22,'ARRIVÉE 3 × 400 V + N ~',{class:'dv inv b'});lab(g,120,38,'réseau TT · disjoncteur général 500 mA',{class:'dv inv s'});
      E('circle',{cx:222,cy:22,r:7,fill:d.s.on?'#4CC36E':d.s.trip?'#E5533D':'#6B737A'},g);
      },
    info:d=>d.s.on?'sous tension':d.s.trip?'déclenché : '+d.s.trip:'hors tension (consigné)'},
  id:{nom:'Interrupteur différentiel 30 mA (Resi9)',cat:'alim',pre:'Q',w:72,h:130,
    bornes:[{n:'eN',l:'N',x:18,y:0,d:'t',f:'N'},{n:'e1',l:'1',x:54,y:0,d:'t'},{n:'sN',l:'N',x:18,y:130,d:'b',f:'N'},{n:'s2',l:'2',x:54,y:130,d:'b'}],
    init:d=>{d.s={on:true,trip:null};},
    links:d=>d.s.on?[['e1','s2'],['eN','sN']]:[],prot:()=>({diff:0.03}),ferme:d=>d.s.on,
    draw(g,d){boitierSE(g,72,130);nomSE(g,d,36,40);marqueSE(g,36,50);tx(g,9,58.5,'Resi9 ID',6.4,'#3A4146',700,'start');
      E('rect',{x:51,y:52,width:13,height:8.5,rx:1.5,fill:SE.vert},g);tx(g,57.5,58.6,'XP',5.6,'#FFFFFF',800);
      tx(g,36,67.5,'40 A · 30 mA',7.4,'#1E2428',800);manetteResi9(g,27,71,d.s.on);
      E('rect',{x:46,y:73,width:18,height:16,rx:2,fill:'#F4F5F4',stroke:'#8E969B','stroke-width':1.2},g);tx(g,55,85,'T',9,'#2B3136',800);
      tx(g,55,97,'test',5.6,'#5E676E',700);zone(g,'test',43,70,24,26);},
    act(d,a,ph){if(ph!=='down')return;if(a==='lever'){if(d.s.on)d.s.on=false;else{d.s.on=true;d.s.trip=null;}return true;}
      if(a==='test'){if(d.s.on&&SIM.ok&&SIM.u(d,'e1','eN')>150){declenche(d,'bouton test');}return true;}},
    info:d=>d.s.on?'fermé':d.s.trip?'déclenché : '+d.s.trip:'ouvert'},
  db:{nom:'Disjoncteur 1P+N (Resi9)',cat:'alim',pre:'Q',w:72,h:130,
    bornes:[{n:'eN',l:'N',x:18,y:0,d:'t',f:'N'},{n:'e1',l:'1',x:54,y:0,d:'t'},{n:'sN',l:'N',x:18,y:130,d:'b',f:'N'},{n:'s2',l:'2',x:54,y:130,d:'b'}],
    params:[{k:'In',lab:'Calibre',opts:[2,10,16,20,32],u:'A',def:16}],
    init:d=>{d.s={on:true,trip:null,th:0};},
    links:d=>d.s.on?[['e1','s2'],['eN','sN']]:[],prot:d=>({mt:+d.p.In}),ferme:d=>d.s.on,
    draw(g,d){boitierSE(g,72,130);nomSE(g,d,36,40);marqueSE(g,36,50);tx(g,9,58.5,'Resi9 DM',6.4,'#3A4146',700,'start');
      E('rect',{x:51,y:52,width:13,height:8.5,rx:1.5,fill:SE.vert},g);tx(g,57.5,58.6,'XP',5.6,'#FFFFFF',800);
      tx(g,36,68,'C'+d.p.In,10,'#1E2428',800);manetteResi9(g,36,71,d.s.on);},
    act(d,a,ph){if(ph!=='down'||a!=='lever')return;if(d.s.on)d.s.on=false;else{d.s.on=true;d.s.trip=null;d.s.th=0;}return true;},
    info:d=>d.s.on?'fermé':d.s.trip?'déclenché : '+d.s.trip:'ouvert'},
  q3:{nom:'Disjoncteur tripolaire (Acti9 iC60N)',cat:'indp',pre:'Q',w:108,h:130,
    bornes:[{n:'a1',l:'1',x:18,y:0,d:'t'},{n:'a3',l:'3',x:54,y:0,d:'t'},{n:'a5',l:'5',x:90,y:0,d:'t'},
            {n:'b2',l:'2',x:18,y:130,d:'b'},{n:'b4',l:'4',x:54,y:130,d:'b'},{n:'b6',l:'6',x:90,y:130,d:'b'}],
    params:[{k:'In',lab:'Calibre',opts:[2,4,6,10,16],u:'A',def:6}],
    init:d=>{d.s={on:true,trip:null,th:0};},
    links:d=>d.s.on?[['a1','b2'],['a3','b4'],['a5','b6']]:[],prot:d=>({mt:+d.p.In}),ferme:d=>d.s.on,
    draw(g,d){boitierSE(g,108,130);nomSE(g,d,54,40);marqueSE(g,10,52,'start');E('line',{x1:58,y1:49,x2:98,y2:49,stroke:SE.vert,'stroke-width':2.4},g);
      tx(g,10,61,'iC60N',6.8,'#3A4146',700,'start');tx(g,98,62,'C'+d.p.In,10,'#1E2428',800,'end');
      const on=d.s.on,yk=on?69:84;
      for(const x of[18,54,90]){E('rect',{x:x-11,y:66,width:22,height:38,rx:5,fill:SE.creux,stroke:'#B3B9BD','stroke-width':1},g);
        E('rect',{x:x-9,y:yk,width:18,height:17,rx:5,fill:'#FFFFFF',stroke:'#9EA5AA','stroke-width':1.1},g);
        E('rect',{x:x-6,y:yk+3,width:12,height:4,rx:1,fill:on?SE.on:SE.off},g);}
      E('rect',{x:8,y:yk+11,width:92,height:6,rx:2,fill:'#23272A'},g);zone(g,'lever',4,62,100,46);},
    act(d,a,ph){if(ph!=='down'||a!=='lever')return;if(d.s.on)d.s.on=false;else{d.s.on=true;d.s.trip=null;d.s.th=0;}return true;},
    info:d=>d.s.on?'fermé':d.s.trip?'déclenché : '+d.s.trip:'ouvert'},
  fu:{nom:'Porte-fusible',cat:'alim',pre:'F',w:40,h:130,
    bornes:[{n:'a',l:'1',x:20,y:0,d:'t'},{n:'b',l:'2',x:20,y:130,d:'b'}],
    params:[{k:'In',lab:'Cartouche gG',opts:[1,2,4,10],u:'A',def:2}],
    init:d=>{d.s={ferme:true,fondu:false,th:0};},
    links:d=>d.s.ferme&&!d.s.fondu?[['a','b']]:[],prot:d=>({fus:+d.p.In}),ferme:d=>d.s.ferme&&!d.s.fondu,
    draw(g,d){corps(g,40,130);nomDev(g,d,20,38);lab(g,20,50,d.p.In+' A',{class:'dv s'});
      const y0=d.s.ferme?56:64;E('rect',{x:9,y:y0,width:22,height:44,rx:4,fill:'#E7E2D4',stroke:'#8A8370'},g);
      E('rect',{x:14,y:y0+8,width:12,height:28,rx:2,fill:d.s.fondu?'#3A3A3A':'#FFFFFF',stroke:'#8A8370'},g);

    bornes:[{n:'N',x:30,y:140,d:'b',f:'N'},{n:'M',l:'▲',x:65,y:140,d:'b'},{n:'D',l:'▼',x:100,y:140,d:'b'},{n:'PE',x:135,y:140,d:'b',f:'PE'}],
    init:d=>{d.s={h:0.5,hs:false,chauffe:0};},
    loads:d=>d.s.hs?[]:[{a:'M',b:'N',z:zpf(230*230/150,0.95),rdc:150,rec:1},{a:'D',b:'N',z:zpf(230*230/150,0.95),rdc:150,rec:1}],

      if(m&&de){d.s.chauffe+=dt/20;if(d.s.chauffe>=1&&!d.s.hs&&!ESSAI){d.s.hs=true;evenement(d.nm+' a grillé : ses deux sens étaient alimentés ensemble','trip');return true;}}
      else if(m)d.s.h=Math.max(0,d.s.h-dt/14);else if(de)d.s.h=Math.min(1,d.s.h+dt/14);},
    draw(g,d){const r=d.r||{},m=r.um>150,de=r.ud>150;
      E('rect',{x:10,y:6,width:150,height:110,rx:6,fill:'#CFE3EF',stroke:'#7C858C','stroke-width':1.6},g);
      const hh=Math.round(100*d.s.h);for(let y=10;y<10+hh;y+=8)E('rect',{x:14,y,width:142,height:7,fill:'#B7BCC0',stroke:'#8D959C','stroke-width':0.8},g);
      E('rect',{x:10,y:0,width:150,height:10,rx:3,fill:'#8D959C'},g);
      E('rect',{x:40,y:96,width:90,height:17,rx:4,fill:'#FFFFFF',opacity:0.9},g);
      lab(g,85,109,d.s.hs?'grillé':m&&de?'deux sens : bloqué':m?'▲ monte':de?'▼ descend':'arrêté',Object.assign({class:'dv s b'},d.s.hs||m&&de?fillS('#C62828'):{}));nomDev(g,d,85,-5);},
    actions:d=>d.s.hs?[['Remplacer le moteur',d=>{d.s.hs=false;d.s.chauffe=0;}]]:[],
    info:d=>{const r=d.r||{};return d.s.hs?'grillé':r.um>150&&r.ud>150?'les deux sens alimentés : il force et chauffe':r.um>150?'monte':r.ud>150?'descend':'arrêté';}},
  bpd:{nom:'Bouton à-coups (deux contacts)',cat:'indc',pre:'S',w:90,h:100,
    bornes:[{n:'13',x:15,y:100,d:'b'},{n:'14',x:35,y:100,d:'b'},{n:'21',x:55,y:100,d:'b'},{n:'22',x:75,y:100,d:'b'}],
    init:d=>{d.s={p:false,trans:false};},links:d=>d.s.p?[['13','14']]:d.s.trans?[]:[['21','22']],
    tick(d){if(d.s.trans){d.s.trans=false;return true;}},
    draw(g,d){E('rect',{x:4,y:4,width:82,height:72,rx:8,fill:'#3A4148'},g);
      E('circle',{cx:45,cy:38,r:d.s.p?18:21,fill:'#202428',stroke:'#C9CED2','stroke-width':2},g);lab(g,45,42,'à-coups',{class:'dv s inv b'});nomDev(g,d,45,-5);zone(g,'btn',12,10,66,58);},
    act(d,a,ph){if(a!=='btn')return;const p=ph==='down';if(p===d.s.p)return;d.s.p=p;if(!p)d.s.trans=true;return true;},
    info:d=>d.s.p?'appuyé : 13-14 fermé, 21-22 ouvert':'relâché : 13-14 ouvert, 21-22 fermé'}});
/* ================= l'état, la sauvegarde, l'historique =================
   st : la platine (appareils, conducteurs). Un conducteur relie deux bornes « idAppareil.borne ».
   d.s : l'état de l'appareil (positions, déclenchements) ; d.r : les grandeurs du dernier calcul,
   jamais sauvées. La platine se garde dans le navigateur, clé KEY. */
const KEY='atelier-cablage-v1';
let st={devs:[],wires:[],nid:1,mis:null};
let opts={lib:true,panel:true,wins:{},col:'marron',sec:1.5,acc:1};
let prog={};
let hist=[];
function devId(id){return st.devs.find(d=>d.id===id);}
function devNm(nm){return st.devs.find(d=>d.nm===nm);}
function autoNom(t){const pre=TYPES[t].pre;if(pre==='Réseau')return st.devs.some(d=>d.nm==='Réseau')?'Réseau 2':'Réseau';
  let i=1;while(st.devs.some(d=>d.nm===pre+i))i++;return pre+i;}
function ajoute(t,x,y,p,nm){const ty=TYPES[t],d={id:'a'+(st.nid++),t,x:Math.round(x),y:Math.round(y),p:{},nm:nm||autoNom(t)};
  for(const q of ty.params||[])d.p[q.k]=q.def;Object.assign(d.p,p||{});if(ty.init)ty.init(d);else d.s={};st.devs.push(d);return d;}
function fil(a,b,col,sec,ext){const w=Object.assign({id:'w'+(st.nid++),a,b,col:col||'marron',sec:sec||1.5},ext||{});st.wires.push(w);return w;}
function bornePos(k){const i=k.lastIndexOf('.');const d=devId(k.slice(0,i));if(!d)return null;const b=TYPES[d.t].bornes.find(x=>x.n===k.slice(i+1));
  return b?{x:d.x+b.x,y:d.y+b.y,d:b.d,dev:d,b}:null;}
function nomBorne(k){const p=bornePos(k);if(!p)return k;const l=p.b.l!=null?p.b.l:p.b.n;return p.dev.nm+' · '+(l||'n° '+p.b.n.replace(/^\D+/,''));}
function snapshot(){return JSON.stringify(st,(k,v)=>k==='r'||k==='route'?undefined:v);}
function restore(s){const o=JSON.parse(s);st={devs:[],wires:[],nid:o.nid||1,mis:o.mis||null};
  for(const d of o.devs||[]){const ty=TYPES[d.t];if(!ty)continue;const p={};for(const q of ty.params||[])p[q.k]=q.def;
    d.p=Object.assign(p,d.p||{});if(!d.s){if(ty.init)ty.init(d);else d.s={};}st.devs.push(d);}
  st.wires=(o.wires||[]).filter(w=>bornePos(w.a)&&bornePos(w.b));}
function pushHist(){hist.push(snapshot());if(hist.length>80)hist.shift();}
function save(){try{localStorage.setItem(KEY,JSON.stringify({s:snapshot(),o:opts,p:prog}));}catch(e){}}
function sousTensionReseau(){return st.devs.some(d=>(d.t==='res1'||d.t==='res3')&&d.s.on);}
/* ================= le moteur de calcul =================
   1. Les conducteurs et les contacts fermés réunissent les bornes en nœuds (union-find).
   2. Les sources fixent le potentiel de certains nœuds (L1, L2, L3, N, PE, secondaire 24 V).
   3. Deux potentiels imposés différents dans le même nœud : un court-circuit, un défaut à la
      terre. La protection qui l'élimine en coupant le moins déclenche (essai par ouverture).
   4. Les autres nœuds se calculent par la méthode des nœuds, en complexes (50 Hz).
   5. Un courant vers la terre fait déclencher le différentiel qui le voit.
   6. Les bobines s'enclenchent ou retombent ; on recommence jusqu'à l'équilibre.
   Le temps (tick) fait chauffer les protections, tourner les moteurs, courir les temporisations. */
let SIM={ok:false,ev:[],Iprot:new Map(),dangers:[],fuite:0,corps:0,V:()=>C0,u:()=>0};
let TEMPS=0,ESSAI=false;
const nk=(d,b)=>b==='@TERRE'?'@TERRE':d.id+'.'+b;
function UF(){const p=new Map();
  const find=k=>{let r=k;for(;;){const q=p.get(r);if(q===undefined||q===r)break;r=q;}let c=k;while(c!==r){const q=p.get(c);p.set(c,r);c=q;}return r;};
  return{find,add:k=>{if(!p.has(k))p.set(k,k);},union:(a,b)=>{const ra=find(a),rb=find(b);if(ra!==rb)p.set(ra,rb);}};}
const protDe=d=>TYPES[d.t].prot?TYPES[d.t].prot(d):null;
const fermeDe=d=>TYPES[d.t].ferme?TYPES[d.t].ferme(d):true;
const estSource=d=>d.t==='res1'||d.t==='res3';

function construit(ouverts){
  const uf=UF();
  for(const d of st.devs)for(const b of TYPES[d.t].bornes)uf.add(nk(d,b.n));
  uf.add('@TERRE');
  for(const w of st.wires)if(!w.cut)uf.union(w.a,w.b);
  for(const d of st.devs){if(ouverts&&ouverts.has(d.id))continue;const ty=TYPES[d.t];if(ty.links)for(const[a,b]of ty.links(d))uf.union(nk(d,a),nk(d,b));}
  const labs=new Map(),put=(k,l)=>{const r=uf.find(k);if(!labs.has(r))labs.set(r,new Set());labs.get(r).add(l);};
  put('@TERRE','PE');
  for(const d of st.devs){const ty=TYPES[d.t];if(!ty.sources)continue;
    const s=ouverts&&ouverts.has(d.id)?(estSource(d)?{PE:'PE'}:{}):ty.sources(d);for(const b in s)put(nk(d,b),s[b]);}
  return{uf,labs};
}
function potLabel(l){if(POT[l])return POT[l];const i=l.lastIndexOf(':');if(l.slice(i+1)==='0')return C0;const d=devId(l.slice(0,i));return d?d.s.emf:C0;}
function potLabels(ls){let v=null;for(const l of ls){if(l[0]==='L')return POT[l];if(l.endsWith(':24'))v=potLabel(l);}return v||C0;}
function conflits(B){const out=[];
  for(const[r,ls]of B.labs){if(ls.size<2)continue;const L=[...ls],N=ls.has('N'),PE=ls.has('PE');
    const ph=L.filter(l=>l==='L1'||l==='L2'||l==='L3'),t24=L.filter(l=>l.endsWith(':24')),t0=L.filter(l=>l.endsWith(':0'));
    if(ph.length>1){out.push({k:'cc',r,txt:'court-circuit entre phases'});continue;}
    if(ph.length&&N){out.push({k:'cc',r,txt:'court-circuit entre phase et neutre'});continue;}
    if(ph.length&&(t24.length||t0.length)){out.push({k:'cc',r,txt:'le circuit de commande touche une phase'});continue;}
    if(ph.length&&PE){out.push({k:'terre',r,txt:'phase reliée à la terre'});continue;}
    let tr=null;for(const l of t24){const id=l.slice(0,l.lastIndexOf(':'));if(t0.includes(id+':0')||t24.length>1||((N||PE)&&zeroRelie(B,id)))tr=id;}
    if(tr){out.push({k:'cc',r,tr,txt:'court-circuit au secondaire du transformateur'});continue;}
    if(N&&PE)out.push({k:'npe',r,txt:'neutre relié à la terre'});}
  return out;}
function zeroRelie(B,id){for(const[,ls]of B.labs)if(ls.has(id+':0')&&(ls.has('PE')||ls.has('N')))return true;return false;}
function sousTension(B){let n=0;for(const d of st.devs)for(const b of TYPES[d.t].bornes){const ls=B.labs.get(B.uf.find(nk(d,b.n)));
  if(ls)for(const l of ls)if(l[0]==='L'||l.endsWith(':24')){n++;break;}}return n;}
function calibre(p){return p.mt||p.fus||p.diff||p.th||0;}

function declenche(d,cause){
  if(d.t==='fu')d.s.fondu=true;else if(d.t==='rt'){d.s.trip=true;d.s.cause=cause;}else if(d.t==='tr'){d.s.hs=true;d.s.cause=cause;d.s.emf=C0;}
  else{d.s.on=false;d.s.trip=cause;}
  evenement(d.t==='fu'?d.nm+' : la cartouche a fondu ('+cause+')':d.t==='tr'?d.nm+' est hors service ('+cause+')':d.nm+' a déclenché : '+cause,'trip');}
function evenement(msg,k){SIM.ev.push({t:TEMPS,msg,k:k||'info'});if(SIM.ev.length>60)SIM.ev.shift();if(!ESSAI)toast(msg,k);}
function traiteConflit(c,B){
  const n0=conflits(B).filter(x=>x.k===c.k).length,cands=[];
  for(const d of st.devs){const p=protDe(d);if(!p||!fermeDe(d)||p.th!=null&&p.mt==null)continue;
    if(c.k==='cc'?(p.mt==null&&p.fus==null):p.diff==null)continue;
    const B2=construit(new Set([d.id]));if(conflits(B2).filter(x=>x.k===c.k).length<n0)cands.push({d,p,score:sousTension(B2)});}
  if(!cands.length){if(c.tr){const t=devId(c.tr);if(t&&!t.s.hs){declenche(t,'court-circuit au secondaire, sans fusible');return true;}}return false;}
  cands.sort((a,b)=>b.score-a.score||calibre(a.p)-calibre(b.p));
  declenche(cands[0].d,c.k==='cc'?c.txt:c.k==='terre'?'défaut d’isolement, '+c.txt:c.txt);return true;}

/* les récepteurs de la platine, avec leurs nœuds */
function chargesDe(){const L=[];for(const d of st.devs){const ty=TYPES[d.t];if(!ty.loads)continue;
  for(const l of ty.loads(d))L.push({d,l,ka:nk(d,l.a),kb:nk(d,l.b),z:l.z});}return L;}
/* la méthode des nœuds en complexes : les nœuds à potentiel imposé sont connus, les autres se calculent */
function resout(B,ch){
  const idx=new Map(),fixe=new Map();let n=0;
  const voir=k=>{const r=B.uf.find(k);if(idx.has(r)||fixe.has(r))return r;const ls=B.labs.get(r);
    if(ls&&ls.size)fixe.set(r,potLabels(ls));else idx.set(r,n++);return r;};
  for(const d of st.devs)for(const b of TYPES[d.t].bornes)voir(nk(d,b.n));voir('@TERRE');
  const Ar=[],Ai=[],br=new Float64Array(n),bi=new Float64Array(n);
  for(let i=0;i<n;i++){Ar.push(new Float64Array(n));Ai.push(new Float64Array(n));Ar[i][i]=1e-9;}
  for(const c of ch){const ra=voir(c.ka),rb=voir(c.kb);if(ra===rb)continue;const y=cdiv([1,0],c.z),ia=idx.get(ra),ib=idx.get(rb);
    if(ia!=null){Ar[ia][ia]+=y[0];Ai[ia][ia]+=y[1];}if(ib!=null){Ar[ib][ib]+=y[0];Ai[ib][ib]+=y[1];}
    if(ia!=null&&ib!=null){Ar[ia][ib]-=y[0];Ai[ia][ib]-=y[1];Ar[ib][ia]-=y[0];Ai[ib][ia]-=y[1];}
    if(ia!=null&&ib==null){const v=cmul(y,fixe.get(rb));br[ia]+=v[0];bi[ia]+=v[1];}
    if(ib!=null&&ia==null){const v=cmul(y,fixe.get(ra));br[ib]+=v[0];bi[ib]+=v[1];}}
  const x=gaussC(Ar,Ai,br,bi,n);
  const Vr=r=>fixe.has(r)?fixe.get(r):idx.has(r)?x[idx.get(r)]:C0;
  return{Vr,V:k=>Vr(B.uf.find(k)),root:k=>B.uf.find(k)};}
function gaussC(Ar,Ai,br,bi,n){
  for(let k=0;k<n;k++){let p=k,m=Math.hypot(Ar[k][k],Ai[k][k]);for(let i=k+1;i<n;i++){const v=Math.hypot(Ar[i][k],Ai[i][k]);if(v>m){m=v;p=i;}}
    if(p!==k){[Ar[k],Ar[p]]=[Ar[p],Ar[k]];[Ai[k],Ai[p]]=[Ai[p],Ai[k]];[br[k],br[p]]=[br[p],br[k]];[bi[k],bi[p]]=[bi[p],bi[k]];}
    const pr=Ar[k][k],pi=Ai[k][k],pm=pr*pr+pi*pi||1e-30;
    for(let i=k+1;i<n;i++){const ar=Ar[i][k],ai=Ai[i][k];if(!ar&&!ai)continue;const fr=(ar*pr+ai*pi)/pm,fi=(ai*pr-ar*pi)/pm;
      const Rk=Ar[k],Ik=Ai[k],Ri=Ar[i],Ii=Ai[i];for(let j=k;j<n;j++){Ri[j]-=fr*Rk[j]-fi*Ik[j];Ii[j]-=fr*Ik[j]+fi*Rk[j];}
      br[i]-=fr*br[k]-fi*bi[k];bi[i]-=fr*bi[k]+fi*br[k];}}
  const x=new Array(n);
  for(let i=n-1;i>=0;i--){let sr=br[i],si=bi[i];for(let j=i+1;j<n;j++){sr-=Ar[i][j]*x[j][0]-Ai[i][j]*x[j][1];si-=Ar[i][j]*x[j][1]+Ai[i][j]*x[j][0];}x[i]=cdiv([sr,si],[Ar[i][i],Ai[i][i]]);}
  return x;}
/* le courant qui part à la terre : celui que voit un différentiel */
function fuite(B,S,ch){let I=C0,Ic=0;const pe=r=>{const ls=B.labs.get(r);return!!(ls&&ls.has('PE'));};
  for(const c of ch){const ra=B.uf.find(c.ka),rb=B.uf.find(c.kb),pa=pe(ra),pb=pe(rb);if(pa===pb)continue;
    const i=cdiv(csub(S.Vr(pa?rb:ra),S.Vr(pa?ra:rb)),c.z);I=cadd(I,i);if(c.l.corps)Ic=cabs(i);}
  return{I:cabs(I),corps:Ic};}
function traiteFuite(f,B){const cands=[];
  for(const d of st.devs){const p=protDe(d);if(!p||p.diff==null||!fermeDe(d)||f.I<0.7*p.diff)continue;
    const B2=construit(new Set([d.id])),ch=chargesDe(),f2=fuite(B2,resout(B2,ch),ch);if(f2.I<0.5*f.I)cands.push({d,p,score:sousTension(B2)});}
  if(!cands.length)return false;cands.sort((a,b)=>b.score-a.score||a.p.diff-b.p.diff);
  declenche(cands[0].d,'courant de fuite de '+fa(f.I)+(f.corps>0.005?', dont '+fa(f.corps)+' à travers le corps':''));return true;}

/* le moteur asynchrone : enroulements, sens, état, intensité en ligne */
const ALPHA=cpol(1,120),ALPHA2=cpol(1,240);
function etatMoteur(d,S,ch){
  const W=ch.filter(c=>c.d===d);if(W.length<3)return{tourne:false,dir:0,etat:d.s.hs?'grillé':'',iL:0,surch:false,k:0};
  const vn=d.p.pl==='400/690'?400:VPH,Vw=W.map(c=>csub(S.V(c.ka),S.V(c.kb))),u=Vw.map(cabs),Iw=W.map((c,k)=>cdiv(Vw[k],c.z));
  const um=Math.min(...u),uM=Math.max(...u);
  const vp=cabs(cadd(Vw[0],cadd(cmul(ALPHA,Vw[1]),cmul(ALPHA2,Vw[2]))))/3,vi=cabs(cadd(Vw[0],cadd(cmul(ALPHA2,Vw[1]),cmul(ALPHA,Vw[2]))))/3;
  let delta=false;
  const roots=W.map(c=>[S.root(c.ka),S.root(c.kb)]);
  for(let a=0;a<3;a++)for(let b=0;b<3;b++)if(a!==b&&roots[a][1]===roots[b][0])delta=true;
  let r={tourne:false,dir:0,etat:'à l’arrêt',iL:0,surch:false,k:0};
  const iw=Math.max(...Iw.map(cabs));
  if(uM<0.3*vn){r.iL=0;return r;}
  const net=Math.max(vp,vi)>2.5*Math.min(vp,vi)&&um>=0.5*vn;
  const f={0:0.35,50:0.6,100:1,130:1.3}[d.p.ch]||1;
  /* k : ce qui multiplie le courant des enroulements calculé sur leur impédance, pour la pince */
  if(!net){r.etat='ronfle sans démarrer : une phase manque';r.surch=true;r.iL=iw*6;r.k=6/(delta?Math.sqrt(3):1);return r;}
  r.dir=vp>=vi?1:-1;
  if(d.s.bloque){r.etat='rotor bloqué';r.surch=true;r.iL=iw*6;r.k=6/(delta?Math.sqrt(3):1);return r;}
  r.tourne=true;
  r.etat=uM>1.25*vn?'tension trop forte sur les enroulements : le couplage ?':um<0.8*vn?'démarrage sous tension réduite (étoile)':'tourne normalement';
  r.surch=uM>1.25*vn;r.k=f*(r.surch?1.7:1);r.iL=iw*(delta?Math.sqrt(3):1)*r.k;return r;}
let SIMB=null;
/* l'intensité de chaque récepteur, pour savoir ce que voit une protection */
function courants(B,S,ch){const m=new Map(),add=(id,i)=>m.set(id,(m.get(id)||0)+i);
  for(const c of ch){if(c.d.t==='mot')continue;const i=cabs(cdiv(csub(S.V(c.ka),S.V(c.kb)),c.z));add(c.d.id,i);}
  for(const d of st.devs)if(d.t==='mot')add(d.id,etatMoteur(d,S,ch).iL);
  return m;}

function ctxDe(S){return{V:(d,b)=>S.V(nk(d,b)),u:(d,a,b)=>cabs(csub(S.V(nk(d,a)),S.V(nk(d,b)))),essai:ESSAI};}
function signature(){return st.devs.map(d=>d.s.c?1:d.s.coil?2:0).join('');}
/* le calcul complet, après chaque geste */
function recalc(){
  const ignore=new Set(),flips=new Map();let B,S,ch,n=0;
  for(let pass=0;pass<60;pass++){
    B=construit();ch=chargesDe();
    const cs=conflits(B).filter(c=>!ignore.has(c.k+'|'+c.r));
    if(cs.length){if(!traiteConflit(cs[0],B))ignore.add(cs[0].k+'|'+cs[0].r);continue;}
    S=resout(B,ch);
    const f=fuite(B,S,ch);if(f.I>0.012&&traiteFuite(f,B))continue;
    const ctx=ctxDe(S);let chg=false;
    for(const d of st.devs){const ty=TYPES[d.t];if(!ty.upd)continue;const c0=d.s.c;if(ty.upd(d,ctx)){chg=true;
      if(d.s.c!==c0){const k=(flips.get(d.id)||0)+1;flips.set(d.id,k);if(k>4&&d.t==='km'&&!d.s.pomp){d.s.pomp=true;d.s.c=false;evenement(d.nm+' pompe : sa propre bobine se coupe et se réalimente sans fin','trip');}}}}
    if(!chg)break;
  }
  finalise(B,S,ch);
}
function finalise(B,S,ch){
  SIMB=B;

   Pour le calcul des tensions, un nœud est un seul point : ses conducteurs et ses contacts fermés
   n'ont pas de résistance. Pour savoir comment le courant s'y partage, on reprend le nœud comme un
   petit réseau : chaque conducteur a sa résistance (cuivre, longueur sur la platine, section),
   chaque contact fermé une résistance minuscule, et chaque borne reçoit le courant que l'appareil
   y prend ou y rend. Les bornes d'une source (arrivée, secondaire du transformateur, la terre)
   ferment le compte. Rend, pour chaque conducteur demandé, son courant complexe de a vers b. */

   chemin s'écartent d'un pas. Recherche A* sur une grille de 10 unités : un coude coûte, passer
   sur un appareil est interdit, longer un conducteur déjà posé coûte un peu, frôler une borne aussi.
   Le tracé ne se garde pas avec la platine : il se recalcule à chaque modification. */

  fil(nk(R,'L'),nk(Q1,'e1'),'marron',6,LK);fil(nk(R,'N'),nk(Q1,'eN'),'bleu',6,LK);fil(nk(R,'PE'),nk(X,'p1'),'vj',6,LK);
  for(const q of Qs){fil(nk(Q1,'s2'),nk(q,'e1'),'marron',6,LK);fil(nk(Q1,'sN'),nk(q,'eN'),'bleu',6,LK);}return{R,Q1,Qs,X};}

function essaiLampe(T,lampes){for(const e of lampes){

function essaiPolarite(T,e){T.ok(T.polarite(e),'La phase arrive sur la borne L de '+e+', le neutre sur N','Phase et neutre sont inversés sur le point lumineux '+e+'.');}
function essaiDirect(T,voyants){
  T.etape('À la mise sous tension');T.ok(T.mot('M1')===0,'À la mise sous tension, le moteur reste à l’arrêt','Le moteur démarre tout seul : le bouton marche est court-circuité, ou l’auto-maintien est mal placé.');

  if(!T.ok(T.mot('M1')!==0,'Un appui sur S1 démarre le moteur','Rien ne démarre : suivez le 24 V depuis F2, à travers F1 (95-96), S0 et S1, jusqu’à A1 de KM1, et le retour de A2 au 0 V.'))return;
  T.relache('S1');T.ok(T.mot('M1')!==0,'Il continue de tourner quand on relâche S1 : l’auto-maintien','Le moteur s’arrête au relâchement : le contact 13-14 de KM1 doit être en parallèle sur S1.');
  if(voyants)T.ok(T.lampe('H1'),'H1 s’allume pendant la marche','H1 doit s’allumer par un contact à fermeture de KM1 (53-54).');
  T.etape('Appui sur S0');T.imp('S0');T.ok(T.mot('M1')===0,'Un appui sur S0 arrête le moteur','S0 ne coupe pas KM1 : il doit être en série, avant S1 et l’auto-maintien.');
  if(voyants)T.ok(!T.lampe('H1'),'H1 s’éteint à l’arrêt','H1 reste allumé à l’arrêt.');
  T.etape('S0 et S1 ensemble');T.appui('S0');T.appui('S1');T.ok(T.mot('M1')===0,'S0 et S1 enfoncés ensemble : l’arrêt l’emporte','La marche l’emporte sur l’arrêt : S0 doit être en amont de S1 et de l’auto-maintien.');T.relache('S1');T.relache('S0');
  T.etape('Surcharge du moteur','Le relais thermique doit couper la bobine de KM1 par son contact 95-96.');T.imp('S1');T.d('M1').s.bloque=true;recalc();T.attendu(true);T.att(12);T.attendu(false);

  T.ok(T.mot('M1')===0,'F1 déclenché, le moteur s’arrête','F1 a déclenché mais le moteur tourne encore : 95-96 de F1 doit être en série dans la commande.');
  if(voyants)T.ok(T.lampe('H2'),'H2 signale le défaut','H2 doit s’allumer par le contact 97-98 de F1.');
  T.d('M1').s.bloque=false;T.d('F1').s.trip=false;T.d('F1').s.th=0;recalc();T.att(0.3);}

      if(!T.ok(b[0]!==b[1]&&c[0]!==c[1]&&b[0]!==c[0],'Chaque touche commande sa lampe, et une seule','Une touche commande les deux lampes, ou aucune : chaque touche (1 et 2) doit alimenter le retour de sa propre lampe.'))return;
      T.ok(d[0]&&d[1],'Les deux touches fermées : les deux lampes allumées','Les deux lampes ne s’allument pas ensemble.');s(1,1);essaiPolarite(T,'E1');essaiPolarite(T,'E2');s(0,0);essaiLampe(T,['E1','E2']);}},
  {id:'d4',grp:'Domestique · CAP',titre:'Le télérupteur et ses trois poussoirs',schema:'d4',court:'Un couloir commandé de trois endroits.',
    consigne:'<p>Un long couloir : les deux lampes <b>E1</b> et <b>E2</b> s’allument ou s’éteignent à chaque appui sur l’un des trois boutons-poussoirs <b>S1</b>, <b>S2</b>, <b>S3</b>.</p><p>Les poussoirs commandent la bobine du télérupteur <b>KL1</b> (230 V) ; son contact 1-2 alimente les lampes. Câblez en 1,5 mm² à partir de <b>Q2</b>.</p>',
    prep(){tabDom([16]);ajoute('tl',240,200,{},'KL1');ajoute('wago5',540,360,{},'W1');ajoute('wago5',700,360,{},'W2');ajoute('wago3',860,360,{},'W3');
      ajoute('dcl',620,130,{},'E1');ajoute('dcl',840,130,{},'E2');ajoute('bp',520,600,{},'S1');ajoute('bp',700,600,{},'S2');ajoute('bp',880,600,{},'S3');},
    test(T){for(const s of['S1','S2','S3']){T.etape('Appui sur '+s);const e0=T.lampe('E1');T.imp(s);
        if(!T.ok(T.lampe('E1')!==e0,'Un appui sur '+s+' change l’état des lampes','Rien ne change à l’appui sur '+s+' : le poussoir doit alimenter A1 de KL1 ; A2 va au neutre ; le contact 1-2 de KL1 alimente les lampes.'))return;}
      T.ok(T.lampe('E1')===T.lampe('E2'),'E1 et E2 s’allument et s’éteignent ensemble','Les deux lampes ne suivent pas le même contact de KL1.');
      if(!T.lampe('E1'))T.imp('S1');essaiPolarite(T,'E1');T.imp('S1');essaiLampe(T,['E1','E2']);}},
  {id:'d5',grp:'Domestique · CAP',titre:'La minuterie de l’escalier',schema:'d5',court:'Un appui, et la lumière s’éteint seule.',
    consigne:'<p>Une cage d’escalier : un appui sur <b>S1</b> ou <b>S2</b> allume <b>E1</b> et <b>E2</b>, qui s’éteignent seules au bout d’une minute.</p><p>La minuterie <b>KT1</b> est alimentée par L et N ; les poussoirs envoient la phase sur sa borne 3 ; sa sortie ⊗ alimente les lampes. Câblez en 1,5 mm² à partir de <b>Q2</b>.</p>',
    prep(){tabDom([16]);ajoute('min',240,200,{},'KT1');ajoute('wago5',540,360,{},'W1');ajoute('wago5',700,360,{},'W2');ajoute('wago3',860,360,{},'W3');
      ajoute('dcl',620,130,{},'E1');ajoute('dcl',840,130,{},'E2');ajoute('bp',560,600,{},'S1');ajoute('bp',800,600,{},'S2');},
    test(T){T.ok(!T.lampe('E1'),'Au repos, l’escalier est éteint','Les lampes restent allumées au repos : elles doivent être alimentées par la sortie ⊗ de KT1, pas par la phase directe.');
      T.etape('Appui sur S1');T.imp('S1');if(!T.ok(T.lampe('E1')&&T.lampe('E2'),'Un appui sur S1 allume les deux lampes','Rien ne s’allume : KT1 doit être alimenté (L, N), S1 doit envoyer la phase sur sa borne 3, et ⊗ alimenter les lampes.'))return;
      T.att(40);T.ok(T.lampe('E1'),'Elles restent allumées pendant la temporisation','Elles s’éteignent trop tôt.');
      T.att(30);T.ok(!T.lampe('E1'),'Elles s’éteignent seules au bout d’une minute','Elles restent allumées : la lampe est peut-être alimentée sans passer par la sortie ⊗.');
      T.etape('Appui sur S2');T.imp('S2');T.ok(T.lampe('E1'),'S2 rallume l’escalier','S2 ne rallume pas : il doit être en parallèle sur S1.');essaiPolarite(T,'E1');T.att(70);essaiLampe(T,['E1','E2']);}},
  {id:'d6',grp:'Domestique · CAP',titre:'Le circuit de prises',schema:'d6',court:'Trois prises, de quoi les protéger.',
    consigne:'<p>Une chambre : trois prises de courant 2P+T, <b>X1</b>, <b>X2</b>, <b>X3</b>, sur le disjoncteur <b>Q2</b> (20 A).</p><p>Câblez les trois prises : la section que demande 20 A, et la terre à chaque prise. Branchez ensuite des appareils depuis le panneau d’une prise, puis l’appareil en défaut.</p>',
    prep(){tabDom([20]);ajoute('wago5',540,360,{},'W1');ajoute('wago5',720,360,{},'W2');ajoute('pc',560,560,{},'X1');ajoute('pc',760,560,{},'X2');ajoute('pc',960,560,{},'X3');},
    test:testPrises},
  {id:'d7',grp:'Domestique · CAP',titre:'Le tableau de répartition',schema:'d7',court:'De l’arrivée aux deux circuits.',
    consigne:'<p>Le tableau d’un studio : l’arrivée, l’interrupteur différentiel <b>Q1</b> (30 mA), puis deux disjoncteurs, <b>Q2</b> (16 A) pour l’éclairage et <b>Q3</b> (20 A) pour les prises. Les circuits partent du bornier <b>X0</b> : 1 et 2 l’éclairage, 3 et 4 les prises.</p><p>Câblez le tableau, en 6 mm² de l’arrivée aux disjoncteurs, et la terre de l’arrivée à la barrette.</p>',
    prep(){const R=ajoute('res1',40,30,{},'Réseau');R.lk=1;ajoute('id',40,200,{},'Q1');ajoute('db',140,200,{In:16},'Q2');ajoute('db',240,200,{In:20},'Q3');
      const X=ajoute('bpe',40,440,{},'XPE');X.lk=1;const X0=ajoute('bor',480,190,{},'X0');X0.lk=1;
      const S1=ajoute('int',600,600,{},'S1'),E1=ajoute('dcl',680,130,{},'E1'),X1=ajoute('pc',920,560,{},'X1');lock(S1,E1,X1);
      fil(k(X0,'b1'),k(S1,'L'),'marron',1.5,LK);fil(k(S1,'1'),k(E1,'L'),'orange',1.5,LK);fil(k(X0,'b2'),k(E1,'N'),'bleu',1.5,LK);
      fil(k(X0,'b3'),k(X1,'L'),'marron',2.5,LK);fil(k(X0,'b4'),k(X1,'N'),'bleu',2.5,LK);fil(k(E1,'PE'),k(X,'p2'),'vj',1.5,LK);fil(k(X1,'PE'),k(X,'p3'),'vj',2.5,LK);},
    tete:6,test:testTableau},
  {id:'d8',grp:'Domestique · CAP',titre:'Le va-et-vient à trois points',schema:'d8',court:'Un permutateur entre deux va-et-vient.',
    consigne:'<p>Un grand séjour à trois portes : la lampe <b>E1</b> se commande de chacune, par deux va-et-vient <b>S1</b> et <b>S3</b> et un permutateur <b>S2</b> entre eux.</p><p>Les navettes de S1 arrivent sur 1 et 2 du permutateur, celles de S3 partent de 3 et 4. Câblez en 1,5 mm² à partir de <b>Q2</b>.</p>',
    prep(){tabDom([16]);ajoute('wago3',560,340,{},'W1');ajoute('wago3',680,340,{},'W2');ajoute('wago3',800,340,{},'W3');ajoute('dcl',720,130,{},'E1');
      ajoute('vv',480,600,{},'S1');ajoute('perm',700,600,{},'S2');ajoute('vv',920,600,{},'S3');},
    test(T){const L=(a,b,c)=>{T.d('S1').s.pos=a;T.d('S2').s.pos=b;T.d('S3').s.pos=c;recalc();T.att(0.1);return T.lampe('E1');};
      const t={};for(let i=0;i<8;i++)t[i]=L(i&1,(i>>1)&1,(i>>2)&1);
      const bascule=bit=>[0,1,2,3,4,5,6,7].every(i=>t[i]!==t[i^bit]);
      T.ok(bascule(1),'S1 allume et éteint, quelles que soient les autres positions','S1 ne commande pas la lampe dans toutes les positions : vérifiez ses deux navettes jusqu’au permutateur.');
      T.ok(bascule(2),'Le permutateur S2 allume et éteint','S2 ne change rien : les navettes de S1 arrivent sur 1 et 2, celles de S3 partent de 3 et 4.');
      T.ok(bascule(4),'S3 allume et éteint','S3 ne commande pas la lampe dans toutes les positions.');
      const on=[0,1,2,3,4,5,6,7].find(i=>t[i]),off=[0,1,2,3,4,5,6,7].find(i=>!t[i]);
      if(on!=null){L(on&1,(on>>1)&1,(on>>2)&1);essaiPolarite(T,'E1');}if(off!=null){L(off&1,(off>>1)&1,(off>>2)&1);essaiLampe(T,['E1']);}}},
  {id:'d9',grp:'Domestique · CAP',titre:'La prise commandée',schema:'d9',court:'Un lampadaire allumé depuis la porte.',
    consigne:'<p>Une chambre : la prise <b>X1</b> est commandée par l’interrupteur <b>S1</b>, près de la porte, pour allumer le lampadaire qui y est branché.</p><p>Câblez en 1,5 mm² à partir de <b>Q2</b> (16 A), avec la terre à la prise.</p>',
    prep(){tabDom([16]);ajoute('wago3',560,340,{},'W1');ajoute('wago3',680,340,{},'W2');ajoute('wago3',800,340,{},'W3');ajoute('pc',760,560,{app:'lampe'},'X1');ajoute('int',540,580,{},'S1');},
    test(T){T.param('X1','app','lampe');T.pos('S1',0);const a=T.u('X1','L','N')>200;T.pos('S1',1);const b=T.u('X1','L','N')>200;
      if(!T.ok(a!==b,'S1 met la prise X1 sous tension et l’en retire','La prise ne change pas quand on bascule S1 : la phase de Q2 passe par S1 avant d’arriver sur L de la prise ; le neutre y va directement.'))return;
      T.pos('S1',a?0:1);T.ok(T.v('X1','L')>150&&T.v('X1','N')<50,'La phase arrive sur la borne L de la prise','Phase et neutre sont inversés sur la prise.');
      T.pos('S1',a?1:0);T.ok(T.sansPhase('X1'),'Prise coupée, aucune de ses bornes n’est sous tension','La prise reste sous tension quand elle est coupée : l’interrupteur doit couper la phase, jamais le neutre.');}},
  {id:'d10',grp:'Domestique · CAP',titre:'Le chauffe-eau en heures creuses',schema:'d10',court:'Le compteur commande, le contacteur coupe.',
    consigne:'<p>Le chauffe-eau <b>B1</b> ne doit chauffer qu’en heures creuses. Le compteur ferme son contact tarifaire (C1-C2) aux heures creuses ; ce contact commande la bobine du contacteur jour/nuit <b>KM1</b> (230 V), dont le contact 1-2 alimente le chauffe-eau.</p><p>Puissance : <b>Q2</b> (20 A), la section qui va avec, et la terre au chauffe-eau. Commande : <b>Q3</b> (2 A). Essayez ensuite les trois positions du sélecteur de KM1 et les deux tarifs du compteur.</p>',
    prep(){tabDom([20,2]);ajoute('hc',340,200,{},'KM1');ajoute('cpt',250,30,{},'Compteur');ajoute('ce',820,110,{},'B1');ajoute('wago3',600,360,{},'W1');},
    test(T){const C=T.d('Compteur'),K=T.d('KM1'),ch=()=>T.u('B1','L','N')>200,mets=(hc,sel)=>{C.s.hc=hc;K.s.sel=sel;recalc();T.att(0.3);};
      mets(false,'auto');T.ok(!ch(),'En heures pleines, le chauffe-eau est arrêté','Le chauffe-eau chauffe en heures pleines : il doit passer par le contact 1-2 de KM1, pas par la phase directe.');
      mets(true,'auto');if(!T.ok(ch(),'En heures creuses, le compteur enclenche KM1 et le chauffe-eau chauffe','Rien ne chauffe en heures creuses : Q3 vers C1, C2 vers A1 de KM1, A2 vers le neutre ; et Q2 vers 1 de KM1, 2 vers la borne L du chauffe-eau.'))return;
      mets(true,'0');T.ok(!ch(),'Sélecteur sur 0 : arrêt, même en heures creuses','Le chauffe-eau chauffe sélecteur sur 0.');
      mets(false,'1');T.ok(ch(),'Sélecteur sur 1 : marche forcée, même en heures pleines','La marche forcée ne fonctionne pas : le chauffe-eau doit être alimenté par le contact 1-2 de KM1.');
      mets(false,'auto');T.ok(T.sansPhase('B1'),'Chauffe-eau arrêté, ses bornes ne sont plus sous tension','Le contact de KM1 coupe le neutre au lieu de la phase.');}},
  {id:'d11',grp:'Domestique · CAP',titre:'Le volet roulant',schema:'d11',court:'Une touche pour monter, une pour descendre.',
    consigne:'<p>Une chambre : le volet roulant est mû par un moteur tubulaire <b>M1</b> à deux sens. Son conducteur bleu est le neutre, ▲ fait monter, ▼ fait descendre. L’interrupteur <b>S1</b> envoie la phase sur l’un ou l’autre, jamais les deux.</p><p>Câblez en 1,5 mm² à partir de <b>Q2</b> (16 A), avec la terre au moteur.</p>',
    prep(){tabDom([16]);ajoute('wago3',580,360,{},'W1');ajoute('wago3',700,360,{},'W2');ajoute('vr',760,110,{},'M1');ajoute('iv',560,580,{},'S1');},
    test(T){const S=T.d('S1'),m=p=>{S.s.pos=p;recalc();T.att(0.2);return[T.u('M1','M','N')>200,T.u('M1','D','N')>200];};
      const r0=m(0),r1=m(1),r2=m(2);
      T.ok(!r0[0]&&!r0[1],'S1 au repos : le moteur n’est pas alimenté','Le moteur reste alimenté au repos : un sens est relié à la phase sans passer par S1.');
      if(!T.ok(r1[0]&&!r1[1],'La touche ▲ fait monter le volet','La touche ▲ n’alimente pas la seule borne ▲ du moteur : la phase arrive sur L de S1, ▲ de S1 va à ▲ du moteur.'))return;
      T.ok(r2[1]&&!r2[0],'La touche ▼ le fait descendre','La touche ▼ n’alimente pas la seule borne ▼ du moteur.');
      m(0);T.ok(T.v('M1','N')<50,'Le neutre du moteur est bien le neutre','La borne N du moteur n’est pas au neutre.');}},
  {id:'i1',grp:'Industriel · CAP et bac pro',titre:'Démarrage direct : la commande',schema:'ic',court:'Marche, arrêt, auto-maintien, voyants.',
    consigne:'<p>Un tapis roulant : son moteur <b>M1</b> démarre par <b>S1</b> et s’arrête par <b>S0</b>. Le circuit de puissance est câblé.</p><p>Câblez le circuit de commande en 24 V, en partant du fusible <b>F2</b> : F1 (95-96), S0, S1 et l’auto-maintien de KM1 (13-14), la bobine de KM1, le voyant de marche <b>H1</b> (KM1 53-54) et le voyant de défaut <b>H2</b> (F1 97-98). Le 0 V est la borne 0 du secondaire de T1.</p>',
    prep(){const A=armoire();const KM1=ajoute('km',40,400,{},'KM1'),F1=ajoute('rt',40,610,{Ir:3.5},'F1'),M1=ajoute('mot',40,780,{},'M1');lock(KM1,F1,M1);
      puissanceDirecte(A,KM1,F1,M1,true);ajoute('bpa',780,360,{},'S0');ajoute('bpm',880,360,{},'S1');ajoute('vy',790,560,{col:'vert'},'H1');ajoute('vy',890,560,{col:'rouge'},'H2');},
    test(T){essaiDirect(T,true);}},
  {id:'i2',grp:'Industriel · CAP et bac pro',titre:'Démarrage direct : la puissance',schema:'ip',court:'Q1, KM1, F1, le moteur et son couplage.',
    consigne:'<p>Le même tapis roulant : cette fois, la commande est câblée et la puissance reste à faire.</p><p>Câblez de <b>Q1</b> au moteur, à travers les pôles de <b>KM1</b> puis de <b>F1</b>, en 1,5 mm², avec la terre au moteur. Lisez la plaque : réglez les barrettes du moteur pour le réseau 400 V et le relais thermique sur l’intensité nominale (panneau de chaque appareil).</p>',
    prep(){const A=armoire();const KM1=ajoute('km',40,400,{},'KM1'),F1=ajoute('rt',40,610,{},'F1'),M1=ajoute('mot',40,780,{cpl:'aucune'},'M1');
      const S0=ajoute('bpa',780,360,{},'S0'),S1=ajoute('bpm',880,360,{},'S1'),H1=ajoute('vy',790,560,{col:'vert'},'H1'),H2=ajoute('vy',890,560,{col:'rouge'},'H2');
      lock(KM1,F1,M1,S0,S1,H1,H2);commandeDirecte(A,KM1,F1,S0,S1,H1,H2,true);},
    test(T){T.etape('Appui sur S1');T.imp('S1');
      if(!T.ok(T.mot('M1')!==0,'KM1 enclenché, le moteur tourne','Le moteur ne tourne pas : chaque phase doit aller de Q1 à KM1 (1, 3, 5), de KM1 (2, 4, 6) à F1 (1, 3, 5), puis de F1 (2, 4, 6) à U1, V1, W1.'))return;
      T.ok(T.d('M1').r.etat==='tourne normalement','Chaque enroulement reçoit sa tension nominale','Les enroulements ne reçoivent pas 230 V : plaque 230/400 V sur un réseau 400 V, quel couplage ?');
      T.ok(T.d('F1').p.Ir===3.5,'F1 est réglé sur l’intensité nominale de la plaque, 3,5 A','Le réglage de F1 ne correspond pas à l’intensité nominale lue sur la plaque du moteur.');
      T.etape('Marche prolongée','Un relais réglé trop bas déclenche en marche normale ; réglé trop haut, il ne protège plus.');T.att(25);
      T.etape('Surcharge du moteur');T.d('M1').s.bloque=true;recalc();T.attendu(true);T.att(12);T.attendu(false);
      T.ok(T.d('F1').s.trip&&T.mot('M1')===0,'Rotor bloqué : F1 déclenche et le moteur s’arrête','F1 ne déclenche pas : le courant du moteur doit traverser les trois pôles de F1.');}},
  {id:'i3',grp:'Industriel · CAP et bac pro',titre:'L’inversion du sens de marche',schema:'ii',court:'Deux contacteurs, et le verrouillage.',
    consigne:'<p>Une porte de quai : <b>S1</b> la fait monter (KM1), <b>S2</b> descendre (KM2), <b>S0</b> l’arrête. La puissance est câblée : KM2 croise L1 et L3.</p><p>Câblez la commande en 24 V : chaque bouton avec son auto-maintien, et le <b>verrouillage électrique</b> — le contact 21-22 de chaque contacteur en série avec la bobine de l’autre. Sans lui, les deux contacteurs fermés ensemble feraient un court-circuit.</p>',
    prep(){const A=armoire();const KM1=ajoute('km',40,400,{},'KM1'),KM2=ajoute('km',290,400,{},'KM2'),F1=ajoute('rt',40,610,{Ir:3.5},'F1'),M1=ajoute('mot',40,780,{},'M1');lock(KM1,KM2,F1,M1);
      const o=LK;fil(k(A.Q1,'b2'),k(KM1,'p1'),'marron',1.5,o);fil(k(A.Q1,'b4'),k(KM1,'p3'),'noir',1.5,o);fil(k(A.Q1,'b6'),k(KM1,'p5'),'gris',1.5,o);
      fil(k(KM1,'p1'),k(KM2,'p1'),'marron',1.5,o);fil(k(KM1,'p3'),k(KM2,'p3'),'noir',1.5,o);fil(k(KM1,'p5'),k(KM2,'p5'),'gris',1.5,o);
      fil(k(KM1,'p2'),k(F1,'r1'),'marron',1.5,o);fil(k(KM1,'p4'),k(F1,'r3'),'noir',1.5,o);fil(k(KM1,'p6'),k(F1,'r5'),'gris',1.5,o);
      fil(k(KM2,'p2'),k(F1,'r5'),'marron',1.5,o);fil(k(KM2,'p4'),k(F1,'r3'),'noir',1.5,o);fil(k(KM2,'p6'),k(F1,'r1'),'gris',1.5,o);
      fil(k(F1,'r2'),k(M1,'U1'),'marron',1.5,o);fil(k(F1,'r4'),k(M1,'V1'),'noir',1.5,o);fil(k(F1,'r6'),k(M1,'W1'),'gris',1.5,o);fil(k(A.R,'PE'),k(M1,'PE'),'vj',1.5,o);
      ajoute('bpa',780,360,{},'S0');ajoute('bpm',880,360,{},'S1');ajoute('bpm',980,360,{},'S2');},
    test(T){T.etape('Appui sur S1');T.imp('S1');const d1=T.mot('M1');
      if(!T.ok(d1!==0&&T.ferme('KM1'),'S1 enclenche KM1 : la porte monte','S1 n’enclenche pas KM1 (auto-maintien compris) : suivez le 24 V de F2 par F1, S0, S1, KM2 21-22, jusqu’à A1 de KM1.'))return;
      T.etape('Appui sur S2 pendant la montée','Le contact 21-22 de KM1 doit être en série avec la bobine de KM2 : pendant que KM1 est fermé, KM2 ne peut pas s’enclencher.');
      T.imp('S2');T.ok(T.ferme('KM1')&&!T.ferme('KM2'),'S2 pendant la montée ne fait rien : le verrouillage électrique','KM2 s’enclenche pendant que KM1 est fermé.');
      T.etape('Appui sur S0');T.imp('S0');T.ok(T.mot('M1')===0,'S0 arrête la porte','S0 n’arrête pas tout : il doit être en série avant les deux branches.');
      T.etape('Appui sur S2');T.imp('S2');const d2=T.mot('M1');
      if(!T.ok(d2!==0&&T.ferme('KM2'),'S2 enclenche KM2, avec son auto-maintien','S2 n’enclenche pas KM2 durablement : S2 et KM2 13-14 en parallèle, puis KM1 21-22, puis A1 de KM2.'))return;
      T.ok(d2===-d1,'KM2 fait tourner le moteur dans l’autre sens','Le moteur tourne dans le même sens.');
      T.etape('Appui sur S1 pendant la descente','Le contact 21-22 de KM2 doit être en série avec la bobine de KM1.');T.imp('S1');
      T.ok(T.ferme('KM2')&&!T.ferme('KM1'),'S1 pendant la descente ne fait rien : verrouillage dans les deux sens','KM1 s’enclenche pendant que KM2 est fermé.');T.imp('S0');}},
  {id:'i4',grp:'Industriel · CAP et bac pro',titre:'Le démarrage étoile-triangle (bac pro)',schema:'iy',court:'Trois contacteurs et une temporisation.',
    consigne:'<p>Un compresseur de 1,5 kW, plaque 400/690 V : il démarre en <b>étoile</b> puis passe en <b>triangle</b> au bout de 5 s, pour limiter l’appel de courant. La puissance est câblée : KM1 la ligne, KM2 l’étoile, KM3 le triangle.</p><p>Câblez la commande en 24 V d’après le schéma : le relais temporisé <b>KA1</b> coupe KM2 par 15-16 et enclenche KM3 par 15-18 ; KM2 et KM3 se verrouillent l’un l’autre.</p>',

function testVV(T){const L=(a,b)=>{T.d('S1').s.pos=a;T.d('S2').s.pos=b;recalc();T.att(0.1);return T.lampe('E1');};
  const t00=L(0,0),t01=L(0,1),t10=L(1,0),t11=L(1,1);
  T.ok(t00!==t10&&t01!==t11,'S1 allume et éteint, quelle que soit la position de S2','S1 ne commande pas la lampe dans toutes les positions : la phase arrive sur L de S1, ses bornes 1 et 2 partent en navettes vers 1 et 2 de S2.');
  T.ok(t00!==t01&&t10!==t11,'S2 allume et éteint, quelle que soit la position de S1','S2 ne commande pas la lampe dans toutes les positions : le retour vers la lampe part de la borne L de S2.');
  const on=[[0,0],[0,1],[1,0],[1,1]].find(([a,b])=>L(a,b)),off=[[0,0],[0,1],[1,0],[1,1]].find(([a,b])=>!L(a,b));
  if(on){L(on[0],on[1]);essaiPolarite(T,'E1');}if(off){L(off[0],off[1]);essaiLampe(T,['E1']);}}
function testPrises(T){
  for(const x of['X1','X2','X3']){T.etape('Bouilloire sur '+x);T.param(x,'app','bouilloire');
    T.ok(T.u(x,'L','N')>200,'La bouilloire fonctionne sur '+x,'Pas de tension entre L et N de '+x+' : la phase et le neutre doivent y arriver.');T.param(x,'app','rien');}
  T.etape('Lave-linge en défaut sur X2','Le courant de fuite doit pouvoir partir à la terre par la borne PE de la prise, pour que le différentiel le voie.');T.attendu(true);
  T.param('X2','app','defaut');T.att(0.3);T.attendu(false);
  T.ok(T.trip('Q1'),'Le lave-linge en défaut fait déclencher le différentiel Q1','Q1 ne déclenche pas : sans terre à la prise, la carcasse de l’appareil reste sous tension et le différentiel ne voit rien.');}
function testTableau(T){
  T.etape('S1 fermé');T.pos('S1',1);if(!T.ok(T.lampe('E1'),'L’éclairage fonctionne','E1 ne s’allume pas : arrivée, Q1, Q2, puis les bornes 1 et 2 du bornier X0.'))return;
  T.param('X1','app','bouilloire');T.ok(T.u('X1','L','N')>200,'La prise X1 est alimentée','X1 n’est pas alimentée : Q3 vers les bornes 3 et 4 du bornier X0.');
  T.etape('Q2 ouvert');T.d('Q2').s.on=false;recalc();T.att(0.1);
  T.ok(!T.lampe('E1')&&T.u('X1','L','N')>200,'Q2 ouvert : l’éclairage s’éteint, les prises restent alimentées','Q2 ne commande pas l’éclairage seul : chaque circuit part de son propre disjoncteur.');
  T.d('Q2').s.on=true;T.d('Q3').s.on=false;recalc();T.att(0.1);
  T.ok(T.lampe('E1')&&T.u('X1','L','N')<50,'Q3 ouvert : les prises sont coupées, l’éclairage reste','Q3 ne commande pas les prises seul.');T.d('Q3').s.on=true;recalc();T.att(0.1);
  T.etape('Court-circuit d’essai sur les prises','Chaque circuit doit être protégé par son disjoncteur.');T.attendu(true);const w=T.fil(['X1','L'],['X1','N']);T.attendu(false);
  T.ok(T.trip('Q3')&&!T.trip('Q2')&&!T.trip('Q1')&&!T.d('Réseau').s.trip,'Un court-circuit sur les prises fait déclencher Q3, et lui seul','Ce n’est pas Q3 qui coupe le court-circuit des prises.');
  st.wires=st.wires.filter(x=>x!==w);T.d('Q3').s.on=true;T.d('Q3').s.trip=null;recalc();T.att(0.1);T.param('X1','app','rien');
  T.etape('Lave-linge en défaut sur X1');T.attendu(true);T.param('X1','app','defaut');T.att(0.3);T.attendu(false);
  T.ok(T.trip('Q1'),'Un défaut d’isolement fait déclencher le différentiel Q1','Q1 ne déclenche pas : l’arrivée doit passer par Q1 avant les disjoncteurs, et la terre aller de l’arrivée à la barrette.');}
/* la solution d'une mission : sert aux dépannages, qui partent d'un câblage complet */
function chargeSolution(id){const m=MISSIONS.find(x=>x.id===id);m.prep();const d=n=>devNm(n);
  const w=(a,b,c,s)=>fil(k(d(a[0]),a[1]),k(d(b[0]),b[1]),c,s||1.5);
  if(id==='d2'){w(['Q2','s2'],['S1','L'],'marron');w(['S1','1'],['S2','1'],'orange');w(['S1','2'],['S2','2'],'violet');w(['S2','L'],['E1','L'],'noir');w(['Q2','sN'],['E1','N'],'bleu');w(['XPE','p2'],['E1','PE'],'vj');}
  if(id==='d6'){w(['Q2','s2'],['X1','L'],'marron',2.5);w(['Q2','sN'],['X1','N'],'bleu',2.5);w(['XPE','p2'],['X1','PE'],'vj',2.5);
    w(['X1','L'],['X2','L'],'marron',2.5);w(['X1','N'],['X2','N'],'bleu',2.5);w(['X1','PE'],['X2','PE'],'vj',2.5);
    w(['X2','L'],['X3','L'],'marron',2.5);w(['X2','N'],['X3','N'],'bleu',2.5);w(['X2','PE'],['X3','PE'],'vj',2.5);}
  if(id==='d3'){w(['Q2','s2'],['S1','L'],'marron');w(['S1','1'],['E1','L'],'orange');w(['S1','2'],['E2','L'],'violet');w(['Q2','sN'],['W1','w1'],'bleu');w(['W1','w2'],['E1','N'],'bleu');w(['W1','w3'],['E2','N'],'bleu');w(['XPE','p2'],['E1','PE'],'vj');w(['XPE','p3'],['E2','PE'],'vj');}
  if(id==='i1'){const A={F2:d('F2'),T1:d('T1')};commandeDirecte(A,d('KM1'),d('F1'),d('S0'),d('S1'),d('H1'),d('H2'),false);}}
function missionCourante(){return st.mis?MISSIONS.find(m=>m.id===st.mis):null;}
function chargeMission(id){const m=MISSIONS.find(x=>x.id===id);if(!m)return;
  st={devs:[],wires:[],nid:1,mis:id};m.prep();for(const d of st.devs){if(estSource(d))d.s.on=false;}
  hist=[];sel=null;attente=null;mesure=null;pince=null;SIM.ev=[];TEMPS=0;commit();ajuster();
  openWin('consigne');majMission();}
/* ================= la vérification d'une mission =================
   Les essais de fonctionnement se jouent sur la platine elle-même, en mode ESSAI (aucun message,
   aucun dessin), puis la platine revient exactement comme l'élève l'a laissée. Viennent ensuite
   les règles du métier, lues sur le câblage : couleurs, terre, sections, conducteurs par borne.
   La page dit ce qui ne va pas et pourquoi ; elle ne montre jamais le câblage attendu. */
const STOP={};
function remiseAZero(){for(const d of st.devs){const s=d.s;
  if('pos'in s)s.pos=0;if('p1'in s){s.p1=0;s.p2=0;}if('p'in s)s.p=false;if('c'in s)s.c=false;if('coil'in s)s.coil=false;

  if(tick(dt)){render();renderPanel();return;}
  animeMoteurs();
  /* ce qui compte (minuterie, temporisation, échauffement) se redessine deux fois par seconde */
  if(++nTick%10===0&&st.devs.some(d=>d.t==='min'&&d.s.t>0||d.t==='ka'&&d.s.coil||d.t==='rt'&&d.s.th>0.01||d.t==='mot'||d.t==='vr'||d.t==='pc'&&d.p.wm==='oui')){render();if(!majVivant()&&sel)renderPanel();}},50);
/* planche de contrôle : tous les schémas d'un coup (#planche-schemas), pour les relire en grand */
if(location.hash==='#planche-schemas'){const p=H('div','planche');p.style.cssText='position:fixed;inset:0;z-index:99;background:#fff;overflow:auto;display:grid;grid-template-columns:1fr;gap:10px;padding:10px';
  for(const k in SCH){const c=H('div');c.style.border='1px solid #ccc';c.appendChild(SCH[k]());p.appendChild(c);}document.body.appendChild(p);}
/* porte d'essai, pour les scénarios */
window.__cab={get st(){return st},recalc,tick,verifier,chargeMission,chargeSolution,MISSIONS,TYPES,devNm,fil,nk,mesureVAT,mesureOhm,
  get SIM(){return SIM},get dernier(){return dernierVerdict},regles,render,commit,construit,conflits,
  choisirOutil,courantsFils,courantPince,lectureMulti,lecturePince,lectureWatt,renderPanel,opts,
  set mesure(v){mesure=v},set pince(v){pince=v},get pince(){return pince},set sel(v){sel=v}};
})();
